    <style>
/* tokens.css */
/* Design tokens - "Paper & Ink, Evergreen accent". Light and dark are paired role-for-role. */
:root,
[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f3ec;
  --surface: #ffffff;
  --surface-2: #fbf9f4;
  --line: #e6e1d5;
  --line-strong: #d3ccbc;
  --ink: #1c1b17;
  --ink-2: #5a5649;
  --ink-3: #6f6a5d;
  --accent: #2f6b57;
  --accent-hover: #265a49;
  --accent-ink: #ffffff;
  --accent-soft: #e3f0ea;
  --warn: #b45309;
  --warn-soft: #fbebd3;
  --danger: #b3362d;
  --danger-soft: #f8e1de;
  --info-soft: #e6edf7;
  --scrim: rgba(28, 27, 23, 0.45);
  --shadow-pop: 0 12px 32px rgba(28, 27, 23, 0.16), 0 2px 6px rgba(28, 27, 23, 0.08);

  --m-today: #2f6b57;
  --m-tasks: #3b6fb6;
  --m-habits: #2f8a5b;
  --m-notes: #7a5bb5;
  --m-health: #c2476b;
  --m-workouts: #c96a1b;
  --m-learning: #1e8c93;
  --m-goals: #a47c0c;
  --m-calendar: #5e6b7a;
  --m-insights: #5e6b7a;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14130f;
  --surface: #1c1b16;
  --surface-2: #22211b;
  --line: #2e2c25;
  --line-strong: #3d3a31;
  --ink: #efebe0;
  --ink-2: #b0aa9a;
  --ink-3: #928c7b;
  --accent: #6fc3a4;
  --accent-hover: #86d0b4;
  --accent-ink: #0e1a15;
  --accent-soft: #1e2f28;
  --warn: #f0b05a;
  --warn-soft: #34281a;
  --danger: #ef8a80;
  --danger-soft: #36201e;
  --info-soft: #1d2735;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-pop: 0 12px 32px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);

  --m-today: #6fc3a4;
  --m-tasks: #7ba6e6;
  --m-habits: #5fc990;
  --m-notes: #b49be0;
  --m-health: #ee8aa8;
  --m-workouts: #eba15f;
  --m-learning: #5fc9cf;
  --m-goals: #e0bb4d;
  --m-calendar: #9aa7b6;
  --m-insights: #9aa7b6;
}

:root {
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-12: 48px;
  --s-16: 64px;

  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;

  --t-fast: 120ms;
  --t-ui: 200ms;
  --t-sheet: 320ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  --sidebar-w: 248px;
  --sidebar-w-collapsed: 72px;
  --topbar-h: 60px;
  --tabbar-h: 64px;
}

/* base.css */
*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { line-height: 1.25; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 2px; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* Programmatic focus targets (route titles, main) are not keyboard stops; no ring needed. */
[tabindex="-1"]:focus { outline: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: var(--s-4); top: -60px; z-index: 200;
  background: var(--accent); color: var(--accent-ink); padding: var(--s-2) var(--s-4);
  border-radius: var(--r-md); text-decoration: none; font-weight: 600;
}
.skip-link:focus { top: var(--s-4); }

.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.display { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.row-gap { display: flex; align-items: center; gap: var(--s-2); }
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.stack-sm { display: flex; flex-direction: column; gap: var(--s-2); }
.spacer { flex: 1; }

/* Route transition */
.view-enter { animation: view-in var(--t-ui) var(--ease) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* components.css */
/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 40px; padding: 0 var(--s-4); border-radius: var(--r-md);
  border: 1px solid transparent; font-weight: 600; font-size: 14px; line-height: 1;
  background: transparent; text-decoration: none; white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not([disabled]) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-secondary:hover:not([disabled]) { background: var(--surface-2); border-color: var(--ink-3); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover:not([disabled]) { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not([disabled]) { filter: brightness(0.92); }
.btn-sm { min-height: 32px; padding: 0 var(--s-3); font-size: 13px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn .spinner { width: 14px; height: 14px; border-width: 2px; }

.spinner {
  width: 20px; height: 20px; border: 2px solid var(--line-strong); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Fields ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font-size: 13px; font-weight: 600; color: var(--ink); }
.field .hint { font-size: 13px; color: var(--ink-3); }
.field .error { font-size: 13px; color: var(--danger); }
.input, .select, .textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--r-md); color: var(--ink);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-3); }
.input:focus-visible, .select:focus-visible, .textarea:focus-visible {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.input[aria-invalid="true"] { border-color: var(--danger); }
.field-row { display: grid; gap: var(--s-3); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.input-group { position: relative; }
.input-group .btn { position: absolute; right: 4px; top: 4px; }
.check { display: inline-flex; align-items: center; gap: var(--s-2); cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- Cards, chips, stats ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5); min-width: 0; }
.card-flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 16px; font-weight: 600; }
.card-head .sub { font-size: 13px; color: var(--ink-3); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; min-height: 24px;
  border-radius: var(--r-pill); font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.chip-info { background: var(--info-soft); color: var(--m-tasks); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--ink-3); }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stats { display: grid; gap: var(--s-3); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); min-width: 0; }
.stat .stat-label { font-size: 13px; color: var(--ink-2); }
.stat .stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .stat-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
button.stat { text-align: left; cursor: pointer; transition: border-color var(--t-fast); }
button.stat:hover { border-color: var(--ink-3); }
button.stat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* ---------- Segmented / tabs ---------- */
.segmented { display: inline-flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); gap: 2px; max-width: 100%; overflow-x: auto; }
.segmented button { border: 0; background: transparent; padding: 6px 12px; min-height: 32px; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.segmented button:hover { color: var(--ink); }
.segmented button[aria-pressed="true"], .segmented button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.chip-scroll { display: flex; gap: var(--s-2); overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }

/* ---------- Rows (shared list item) ---------- */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); min-height: 56px; border-bottom: 1px solid var(--line); min-width: 0; background: var(--surface); transition: background var(--t-fast); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 15px; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--ink-3); margin-top: 2px; min-width: 0; }
.row-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.row.is-done .row-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.row.is-overdue { box-shadow: inset 3px 0 0 var(--danger); }

.checkbtn {
  width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--line-strong);
  background: transparent; display: grid; place-items: center; color: transparent; padding: 0;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
  position: relative;
}
.checkbtn::before { content: ""; position: absolute; inset: -8px; }
.checkbtn:hover { border-color: var(--accent); }
.checkbtn[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.checkbtn[data-state="skipped"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.checkbtn svg { width: 16px; height: 16px; }
.checkbtn:active { transform: scale(0.92); }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; display: inline-block; }
.group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: var(--s-3) var(--s-4) var(--s-2); background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: var(--s-2); }

/* ---------- Progress, ring ---------- */
.progress { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-pill); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: var(--r-pill); transition: width 500ms var(--ease); }
.ring { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring .ring-bg { stroke: var(--line); }
.ring .ring-fg { stroke: var(--accent); transition: stroke-dashoffset 700ms var(--ease); }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .ring-label b { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.ring .ring-label span { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---------- Empty, error, skeleton ---------- */
.empty { display: grid; place-items: center; text-align: center; gap: var(--s-2); padding: var(--s-12) var(--s-5); color: var(--ink-2); }
.empty .empty-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); }
.empty h3 { font-size: 16px; color: var(--ink); }
.empty p { font-size: 14px; max-width: 42ch; }
.skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: var(--r-sm); min-height: 14px; }
.skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 7%, transparent), transparent); transform: translateX(-100%); animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.banner { display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); font-size: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.banner-danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.banner-warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }

/* ---------- Modal / sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: grid; place-items: center; padding: var(--s-4); animation: fade var(--t-ui) var(--ease); }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); width: min(560px, 100%); max-height: min(88vh, 860px); display: flex; flex-direction: column; box-shadow: var(--shadow-pop); animation: pop var(--t-ui) var(--ease); }
.modal-wide { width: min(760px, 100%); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
.modal-head { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 18px; font-weight: 600; flex: 1; }
.modal-body { padding: var(--s-5); overflow-y: auto; display: flex; flex-direction: column; gap: var(--s-4); }
.modal-foot { display: flex; justify-content: flex-end; gap: var(--s-2); padding: var(--s-3) var(--s-5) var(--s-4); border-top: 1px solid var(--line); }

/* ---------- Menu / popover ---------- */
.menu { position: fixed; z-index: 120; min-width: 200px; max-width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-pop); padding: 6px; animation: pop var(--t-fast) var(--ease); }
.menu button, .menu a { display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 40px; padding: 8px 10px; border: 0; background: transparent; text-align: left; border-radius: var(--r-sm); font-size: 14px; color: var(--ink); text-decoration: none; }
.menu button:hover, .menu button:focus-visible, .menu a:hover { background: var(--surface-2); outline: none; }
.menu .danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.menu .menu-head { padding: 8px 10px; font-size: 13px; color: var(--ink-3); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; z-index: 150; left: 50%; bottom: calc(var(--s-6) + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: var(--s-2); align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--s-3); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-md); font-size: 14px; box-shadow: var(--shadow-pop); animation: pop var(--t-ui) var(--ease); max-width: 100%; }
.toast-error { background: var(--danger); color: #fff; }
.toast button { background: transparent; border: 0; color: inherit; text-decoration: underline; font-weight: 600; padding: 0; }

/* ---------- Command bar ---------- */
.cmd-backdrop { align-items: start; padding-top: 12vh; }
.cmd { width: min(620px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); overflow: hidden; animation: pop var(--t-ui) var(--ease); }
.cmd input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 16px 18px; font-size: 16px; outline: none; }
.cmd-list { max-height: min(52vh, 420px); overflow-y: auto; padding: 6px; }
.cmd-group { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px 4px; }
.cmd-item { display: flex; align-items: center; gap: var(--s-3); width: 100%; border: 0; background: transparent; text-align: left; padding: 10px 12px; min-height: 44px; border-radius: var(--r-md); color: var(--ink); }
.cmd-item[aria-selected="true"] { background: var(--accent-soft); }
.cmd-item .snip { font-size: 13px; color: var(--ink-3); }
kbd { font: 600 12px var(--font-ui); padding: 2px 6px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; color: var(--ink-2); background: var(--surface-2); }

/* ---------- Charts ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 12px var(--font-ui); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: block; }
.heat i[data-s="completed"] { background: var(--accent); border-color: var(--accent); }
.heat i[data-s="skipped"] { background: var(--warn); border-color: var(--warn); opacity: 0.7; }
.heat i[data-s="missed"] { background: var(--danger); border-color: var(--danger); opacity: 0.6; }
.heat i[data-s="na"] { background: transparent; border-style: dashed; }

/* layout.css */
/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.app.collapsed { grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr); }

.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); padding: var(--s-4) var(--s-3); overflow-y: auto; overflow-x: hidden; }
